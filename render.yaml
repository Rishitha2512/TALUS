services:
  - type: web
    name: talus-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TALUS_DATABASE_URL
        fromDatabase:
          name: talus-db
          property: connectionString
      - key: TALUS_AUTH_ENABLED
        value: "true"
      - key: TALUS_AUTH_SECRET
        generateValue: true
      - key: TALUS_ADMIN_USERNAME
        value: admin
      - key: TALUS_ADMIN_PASSWORD
        sync: false
      - key: TALUS_CORS_ORIGINS
        value: "*"
      - key: TALUS_YOLO_ENABLED
        value: "false"
  - type: web
    name: talus-control-room
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    plan: free
    envVars:
      - key: TALUS_API_URL
        value: https://talus-api.onrender.com
databases:
  - name: talus-db
    databaseName: talus
    user: talus
    plan: free
